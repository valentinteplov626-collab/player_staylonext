<style>
body {
  margin: 0;
  background: #e5e5e5;
  display: flex;
  justify-content: center;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

.app-wrapper {
  width: 100%;
  max-width: 480px;
  background: #fff;
  min-height: 100vh;
  box-shadow: 0 0 15px rgba(0,0,0,0.1);
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
}


.video-header {
  padding: 10px 15px;
  border-bottom: 1px solid #f0f0f0;
}
.video-title {
  font-size: 16px;
  font-weight: bold;
  margin: 0 0 8px 0;
  line-height: 1.3;
  color: #111;
}
.badge {
  display: inline-block;
  font-size: 10px;
  padding: 2px 4px;
  border-radius: 3px;
  vertical-align: middle;
  margin-left: 4px;
  font-weight: normal;
}
.badge-gray { background: #888; color: #fff; }
.badge-red { background: #ff0000; color: #fff; }

.channel-info {
  display: flex;
  align-items: center;
  font-size: 13px;
  margin-bottom: 8px;
}
.channel-info span {
  font-weight: bold;
}
.subs-count {
  background: #f0f0f0;
  border: 1px solid #ccc;
  padding: 1px 4px;
  border-radius: 2px;
  margin-left: 6px;
  font-size: 11px;
  color: #333;
}

.subscribe-row {
  display: flex;
  gap: 8px;
}
.btn-sub {
  background: #e62117;
  color: #fff;
  border: none;
  padding: 5px 12px;
  border-radius: 3px;
  font-size: 12px;
  font-weight: bold;
  display: flex;
  align-items: center;
}
.btn-sub .subs-count {
  background: #fff;
  color: #e62117;
  border: none;
}
.btn-icon {
  background: transparent;
  border: 1px solid #ccc;
  padding: 5px 10px;
  border-radius: 3px;
  font-size: 14px;
  color: #333;
}


.video-container {
  position: relative;
  width: 100%;
  aspect-ratio: 16/9;
  background: #000;
  
  overflow: hidden;
  flex-shrink: 0;
}
.xh-frame {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0;
  filter: blur(15px) brightness(0.55);
  transition: opacity 0.3s ease, filter 0.5s ease;
  will-change: opacity, filter;
}
.xh-frame.loaded {
  opacity: 1;
  filter: blur(3px) brightness(0.7);
}
.xh-loader {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 46px;
  height: 46px;
  border: 4px solid rgba(255,255,255,.15);
  border-top-color: #fff;
  border-radius: 50%;
  transform: translate(-50%,-50%);
  animation: spin 1s linear infinite;
  z-index: 30;
}
@keyframes spin {
  to { transform: translate(-50%,-50%) rotate(360deg); }
}
.central-play {
  position: absolute;
  top: 40%;
  left: 50%;
  width: 70px;
  height: 70px;
  background: rgba(255,255,255,.2);
  border-radius: 50%;
  transform: translate(-50%,-50%);
  z-index: 25;
  animation: pulsePlay 1.6s ease-in-out infinite;
  backdrop-filter: blur(2px);
}
.central-play::after {
  content: "";
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-40%,-50%);
  border-style: solid;
  border-width: 15px 0 15px 25px;
  border-color: transparent transparent transparent #fff;
}
.central-play.hidden {
  animation: none;
  opacity: 0;
  pointer-events: none;
}
@keyframes pulsePlay {
  0%    { transform: translate(-50%,-50%) scale(1); opacity:.85 }
  50%   { transform: translate(-50%,-50%) scale(1.08); opacity:1 }
  100% { transform: translate(-50%,-50%) scale(1); opacity:.85 }
}
.player-interface {
  position: absolute;
  bottom: 0;
  width: 100%;
  padding: 10px;
  background: linear-gradient(transparent, rgba(0,0,0,.85));
  z-index: 20;
  box-sizing: border-box;
}
.progress-bg {
  width: 100%;
  height: 4px;
  background: rgba(255,255,255,.2);
  position: relative;
}
.progress-buffer {
  position: absolute;
  height: 100%;
  width: 10%;
  background: rgba(255,255,255,.5);
  transition: width 15s linear;
}
.progress-play {
  position: absolute;
  height: 100%;
  width: 7%;
  background: #ff0000;
}
.progress-play::after {
  content: "";
  position: absolute;
  right: -6px;
  top: -4px;
  width: 12px;
  height: 12px;
  background: #ff0000;
  border-radius: 50%;
}
.controls {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 12px;
  color: #fff;
  margin-top: 8px;
}
.play-icon {
  width: 0;
  height: 0;
  border-top: 7px solid transparent;
  border-bottom: 7px solid transparent;
  border-left: 12px solid #fff;
}


.action-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 15px;
  border-bottom: 1px solid #ddd;
  font-size: 11px;
  color: #555;
  text-align: center;
}
.action-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  position: relative;
}
.action-item .icon { font-size: 18px; color: #888; }
.action-item .value { font-weight: bold; color: #000; font-size: 13px; }
.action-item .bar-container { width: 40px; height: 3px; background: #ccc; margin-top: 2px; }
.action-item .bar-fill { width: 100%; height: 100%; background: #888; }
.comment-badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: #ff0000;
  color: #fff;
  border-radius: 50%;
  width: 14px;
  height: 14px;
  font-size: 9px;
  display: flex;
  align-items: center;
  justify-content: center;
}


.tabs { display: flex; border-bottom: 1px solid #ddd; }
.tab { flex: 1; text-align: center; padding: 12px 0; font-size: 13px; color: #777; text-transform: uppercase; }
.tab.active { color: #000; font-weight: bold; border-bottom: 2px solid #000; }


.related-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding: 15px;
  background: #f9f9f9;
}
.related-item { display: flex; flex-direction: column; }
.thumb-wrapper {
  position: relative;
  width: 100%;
  aspect-ratio: 16/9;
  background: #ccc;
  border-radius: 2px;
  overflow: hidden;
  margin-bottom: 6px;
}
.thumb-wrapper img { width: 100%; height: 100%; object-fit: cover; }
.thumb-badge {
  position: absolute;
  bottom: 4px;
  font-size: 10px;
  padding: 2px 4px;
  border-radius: 2px;
  background: rgba(0,0,0,0.7);
  color: #fff;
}
.badge-left { left: 4px; }
.badge-right { right: 4px; background: #ff0000; }
.thumb-title {
  font-size: 12px;
  font-weight: 500;
  color: #111;
  line-height: 1.3;
  margin-bottom: 4px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.thumb-channel { font-size: 11px; color: #777; }
</style>
</head>
